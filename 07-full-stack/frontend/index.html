<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker 101 – Full-stack</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #aecbf7;
      color: #0d1117;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { color: #225da0; }
    input {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem 1rem;
      background: #238636;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; }
    li {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .timestamp { font-size: 0.8em; color: #0d1117; }
  </style>
</head>
<body>
  <h1>Meldingstavle</h1>
  <p>Frontend (Nginx) → Backend (Node.js) → Database (PostgreSQL)</p>

  <input id="messageInput" type="text" placeholder="Skriv en melding..." />
  <button onclick="sendMessage()">Send</button>

  <ul id="messageList"></ul>

  <script>
    async function fetchMessages() {
      const response = await fetch('/api/messages');
      const messages = await response.json();
      const list = document.getElementById('messageList');
      list.innerHTML = messages.map(m => `
        <li>
          <div>${m.text}</div>
          <div class="timestamp">${new Date(m.created_at).toLocaleString('no-NO')}</div>
        </li>
      `).join('');
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      if (!input.value.trim()) return;
      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: input.value }),
      });
      input.value = '';
      fetchMessages();
    }

    // Last meldinger ved oppstart
    fetchMessages();
  </script>
</body>
</html>
