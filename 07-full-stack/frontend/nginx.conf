server {
    listen 80;

    # Server statiske filer fra standardmappen
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy /api/-forespørsler til backend-tjenesten
    # "backend" er tjenestenavnet i docker-compose.yml
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
