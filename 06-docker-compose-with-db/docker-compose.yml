services:
  app:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      # Tjenester snakker med hverandre via tjenestenavnet som hostname
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        # Vent til databasen rapporterer at den er klar – ikke bare at prosessen er startet
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Navngitt volum – data overlever selv om containeren stoppes og slettes
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
